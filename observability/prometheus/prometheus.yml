global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s
  external_labels:
    deployment: ppe-remote-inference

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: inference-api
    metrics_path: /metrics
    static_configs:
      - targets: ["ppe-yolo26n-640-inference-api-1:8080"]
        labels: {model_service: "yolo26n-640"}
      - targets: ["ppe-yolo26n-960-inference-api-1:8080"]
        labels: {model_service: "yolo26n-960"}
      - targets: ["ppe-yolo26s-640-inference-api-1:8080"]
        labels: {model_service: "yolo26s-640"}
      - targets: ["ppe-yolo26m-640-inference-api-1:8080"]
        labels: {model_service: "yolo26m-640"}
      - targets: ["ppe-yolo26l-640-inference-api-1:8080"]
        labels: {model_service: "yolo26l-640"}
      - targets: ["ppe-yolo26x-640-inference-api-1:8080"]
        labels: {model_service: "yolo26x-640"}

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: dcgm-exporter
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["prometheus:9090"]
